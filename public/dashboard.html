<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Exam System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow-md">
    <div class="font-bold text-lg">Exam Portal</div>
    <div class="flex items-center gap-4">
      <span id="userInfo" class="text-sm bg-slate-800 px-3 py-1 rounded-full border border-slate-700">Loading...</span>
      <button onclick="logout()" class="text-sm bg-red-600 hover:bg-red-700 px-3 py-1 rounded">Logout</button>
    </div>
  </nav>

  <!-- Sidebar & Content -->
  <div class="flex">
    <aside class="w-64 bg-white border-r min-h-[calc(100vh-60px)] p-4 space-y-2">
      <a href="dashboard.html" class="block px-4 py-2 bg-blue-50 text-blue-600 font-medium rounded-lg">Dashboard</a>
      <a href="examinations.html" class="block px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Examinations</a>
      <a href="results.html" class="block px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Results</a>
    </aside>

    <main class="flex-1 p-8">
      <h2 class="text-2xl font-bold text-slate-800 mb-6">Overview</h2>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-white p-6 rounded-xl border shadow-sm">
          <p class="text-sm text-slate-500 font-medium">Scheduled Exams</p>
          <p class="text-3xl font-bold text-blue-600 mt-2">5</p>
        </div>
        <div class="bg-white p-6 rounded-xl border shadow-sm">
          <p class="text-sm text-slate-500 font-medium">Active Courses</p>
          <p class="text-3xl font-bold text-emerald-600 mt-2">5</p>
        </div>
        <div class="bg-white p-6 rounded-xl border shadow-sm">
          <p class="text-sm text-slate-500 font-medium">Published Results</p>
          <p class="text-3xl font-bold text-indigo-600 mt-2">7</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user) window.location.href = '/index.html';
    
    document.getElementById('userInfo').textContent = `${user.name} (${user.role})`;

    function logout() {
      localStorage.clear();
      window.location.href = '/index.html';
    }
  </script>
</body>
</html>
